<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin Học Viên</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .info-group {
            margin-bottom: 15px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .label {
            font-weight: bold;
            color: #7f8c8d;
            text-transform: uppercase;
            font-size: 12px;
        }
        .value {
            font-size: 18px;
            color: #2c3e50;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>THÔNG TIN HỌC VIÊN</h1>
        <div class="info-group">
            <div class="label">Họ và tên</div>
            <div class="value">Nguyễn Văn A</div>
        </div>
        <div class="info-group">
            <div class="label">Mã lớp</div>
            <div class="value">DevOps-K28</div>
        </div>
    </div>
</body>
</html>
